name: MSIX

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/msix/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/msix.yml'
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/msix/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/msix.yml'

permissions:
  contents: read

jobs:
  build-msix-x64:
    name: Build and validate x64 MSIX
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Get-Content -LiteralPath 'src-tauri\msix\package-identity.json' -Raw | ConvertFrom-Json
          $mode = if ($identity.state -eq 'partnerCenter') { 'Store' } else { 'Dev' }
          & 'scripts\msix\Build-Msix.ps1' -Mode $mode -Configuration Release

      - name: Upload validated MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nomo-msix-x64-${{ github.sha }}
          path: .artifacts/msix/output/*
          if-no-files-found: error
