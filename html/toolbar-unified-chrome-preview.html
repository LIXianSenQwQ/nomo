<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nomo 编辑器四种工具栏视觉方案的交互式对比原型" />
    <title>Nomo · 四种工具栏方案对比</title>
    <style>
      :root {
        color-scheme: light;
        --stage: #e7eaeb;
        --shell: #f1f3f4;
        --chrome: #f7f8f8;
        --canvas: #ffffff;
        --foreground: #20272c;
        --muted: #68757e;
        --muted-soft: #8a959c;
        --line: rgba(49, 64, 73, 0.11);
        --line-soft: rgba(49, 64, 73, 0.07);
        --accent: #2e8275;
        --accent-strong: #23695f;
        --accent-soft: #e7f1ef;
        --hover: rgba(49, 64, 73, 0.065);
        --window-shadow: 0 24px 70px rgba(53, 68, 75, 0.18);
        --workspace-shadow:
          -1px -1px 0 rgba(66, 82, 89, 0.16), -7px -4px 18px rgba(57, 75, 82, 0.11);
        --font-ui: 'Segoe UI Variable', 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        place-items: center;
        gap: 13px;
        overflow: hidden;
        padding: 14px 16px 16px;
        background: var(--stage);
        color: var(--foreground);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .app-window {
        width: min(1520px, calc(100vw - 32px));
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        border: 1px solid rgba(24, 33, 38, 0.7);
        border-radius: 14px;
        background: var(--shell);
        box-shadow: var(--window-shadow);
      }

      .window-titlebar {
        display: flex;
        height: 54px;
        align-items: center;
        gap: 22px;
        padding-left: 14px;
        background: var(--shell);
        user-select: none;
      }

      .brand {
        font-size: 17px;
        font-weight: 670;
        letter-spacing: -0.02em;
      }

      .app-menu {
        display: flex;
        height: 100%;
        align-items: center;
        gap: 4px;
      }

      .menu-item,
      .window-control {
        border: 0;
        background: transparent;
        cursor: default;
      }

      .menu-item {
        height: 34px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: 14px;
      }

      .menu-item:hover,
      .window-control:hover {
        background: var(--hover);
      }

      .window-controls {
        display: flex;
        height: 100%;
        margin-left: auto;
      }

      .window-control {
        display: grid;
        width: 48px;
        height: 100%;
        place-items: center;
        color: #30383d;
      }

      .window-control.close:hover {
        background: #c9363f;
        color: #fff;
      }

      .window-control svg {
        width: 16px;
        height: 16px;
      }

      .app-body {
        display: grid;
        height: calc(100% - 54px);
        grid-template-columns: 250px minmax(0, 1fr);
        min-height: 0;
      }

      .explorer {
        min-width: 0;
        overflow: hidden;
        padding: 17px 12px 16px 0;
        background: var(--shell);
      }

      .root-row,
      .file-row {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 0 7px 7px 0;
        background: transparent;
        color: #424c53;
        text-align: left;
      }

      .root-row {
        height: 34px;
        padding: 0 12px 0 4px;
        color: #172126;
        font-size: 16px;
        font-weight: 650;
      }

      .file-row {
        height: 36px;
        padding: 0 12px 0 18px;
        font-size: 14px;
      }

      .file-row:hover,
      .file-row.active {
        background: rgba(255, 255, 255, 0.48);
      }

      .file-row.active {
        color: var(--accent-strong);
        font-weight: 590;
      }

      .row-icon {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        color: var(--muted);
      }

      .root-row .row-icon {
        color: var(--accent);
      }

      .row-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tree-indent {
        margin-left: 16px;
      }

      .editor-shell {
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
        border-top-left-radius: 13px;
        background: var(--canvas);
        box-shadow: var(--workspace-shadow);
      }

      /* 标签栏与工具栏共享同一个承载面，不再形成两层横条。 */
      .editor-chrome {
        position: relative;
        z-index: 2;
        overflow: hidden;
        border-top-left-radius: inherit;
        border-bottom: 1px solid var(--line);
        background: var(--chrome);
      }

      .tabbar {
        display: flex;
        height: 40px;
        align-items: flex-end;
        padding-left: 10px;
      }

      .tab {
        position: relative;
        display: flex;
        min-width: 120px;
        max-width: 180px;
        height: 38px;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: #4c5860;
        font-size: 14px;
        font-weight: 520;
        letter-spacing: -0.01em;
      }

      .tab.active {
        color: #20292e;
        font-weight: 620;
      }

      .tab:not(.active):hover {
        background: rgba(255, 255, 255, 0.38);
      }

      .tab.active::after {
        position: absolute;
        right: 12px;
        bottom: 0;
        left: 12px;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--accent);
        content: '';
      }

      .tab-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .tab-close {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }

      .tab-icon {
        color: var(--accent);
      }

      .tab:not(.active) .tab-icon {
        color: #859198;
      }

      .tab-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tab-close {
        display: grid;
        margin-left: 0;
        place-items: center;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--accent-strong);
        font-size: 15px;
        transition:
          opacity 140ms ease,
          background-color 140ms ease;
      }

      .tab:not(.active) .tab-close {
        color: #77838a;
        opacity: 0;
      }

      .tab:not(.active):hover .tab-close,
      .tab:not(.active):focus-within .tab-close {
        opacity: 1;
      }

      .tab-close:hover {
        background: var(--hover);
      }

      .new-tab {
        display: grid;
        width: 32px;
        height: 28px;
        margin-bottom: 2px;
        margin-left: 4px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
      }

      .new-tab:hover {
        background: var(--hover);
      }

      .toolbar {
        display: flex;
        height: 44px;
        align-items: center;
        gap: 4px;
        padding: 5px 16px;
        /* 与 tabbar 同色，也没有二者之间的 border。 */
        background: transparent;
      }

      .tool-button {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background-color 150ms ease,
          color 150ms ease,
          transform 120ms ease;
      }

      .tool-button:hover {
        background: var(--hover);
        color: #3f4b53;
      }

      .tool-button:active {
        transform: translateY(1px);
      }

      .tool-button:focus-visible,
      .tab-close:focus-visible,
      .new-tab:focus-visible,
      .menu-item:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 58%, transparent);
        outline-offset: -2px;
      }

      .tool-button.selected {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .tool-button svg {
        width: 21px;
        height: 21px;
        stroke-width: 1.75;
      }

      .tool-text {
        font-size: 17px;
        line-height: 1;
      }

      .tool-text.bold {
        font-weight: 700;
      }

      .tool-text.italic {
        font-family: Georgia, serif;
        font-size: 22px;
        font-style: italic;
      }

      .tool-divider {
        width: 1px;
        height: 24px;
        margin: 0 8px;
        background: var(--line);
      }

      .toolbar-spacer {
        min-width: 16px;
        flex: 1 1 auto;
      }

      .zoom-control {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .zoom-track {
        position: relative;
        width: 88px;
        height: 4px;
        border-radius: 999px;
        background: #c8ced1;
      }

      .zoom-track::before {
        position: absolute;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        content: '';
      }

      .zoom-track::after {
        position: absolute;
        top: 50%;
        left: 42%;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 1px 3px rgba(31, 74, 68, 0.2);
        content: '';
        transform: translate(-50%, -50%);
      }

      .view-switcher {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .document-viewport {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        background: var(--canvas);
      }

      .document {
        width: min(760px, calc(100% - 380px));
        margin: 54px 310px 120px auto;
        font-size: 17px;
        line-height: 1.78;
      }

      .document h1 {
        margin: 0 0 24px;
        color: #12191d;
        font-size: clamp(31px, 3.1vw, 43px);
        font-weight: 720;
        letter-spacing: -0.045em;
        line-height: 1.2;
        text-wrap: balance;
      }

      .document h2 {
        margin: 38px 0 14px;
        font-size: 23px;
        letter-spacing: -0.025em;
      }

      .document ul {
        margin: 0;
        padding-left: 1.5em;
      }

      .document li {
        margin: 8px 0;
      }

      .document code {
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 0.88em;
      }

      .outline-panel {
        position: absolute;
        top: 50px;
        right: 34px;
        width: 236px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 22px rgba(57, 73, 80, 0.09);
      }

      .outline-panel h2 {
        margin: 0 0 14px;
        font-size: 16px;
      }

      .outline-item {
        overflow: hidden;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 14px;
        font-weight: 620;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .design-note {
        position: absolute;
        right: 28px;
        bottom: 22px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--muted-soft);
        font-size: 12px;
        backdrop-filter: blur(8px);
      }

      .design-note::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: '';
      }

      .comparison-header {
        display: grid;
        width: min(1520px, calc(100vw - 32px));
        grid-template-columns: minmax(250px, 0.72fr) minmax(620px, 1.5fr);
        align-items: center;
        gap: 24px;
      }

      .concept-copy {
        min-width: 0;
      }

      .concept-kicker {
        margin: 0 0 2px;
        color: var(--accent-strong);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .concept-copy h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 680;
        letter-spacing: -0.025em;
        line-height: 1.25;
      }

      .concept-description {
        overflow: hidden;
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .variant-switcher {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
        padding: 5px;
        border: 1px solid rgba(49, 64, 73, 0.1);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.52);
        box-shadow: 0 8px 24px rgba(56, 70, 77, 0.06);
      }

      .variant-button {
        display: flex;
        min-width: 0;
        height: 42px;
        align-items: center;
        gap: 9px;
        padding: 0 11px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #556169;
        cursor: pointer;
        text-align: left;
        transition:
          background-color 160ms ease,
          color 160ms ease,
          box-shadow 160ms ease;
      }

      .variant-button:hover {
        background: rgba(255, 255, 255, 0.64);
        color: #303a40;
      }

      .variant-button.active {
        background: #fff;
        color: #20292e;
        box-shadow:
          0 1px 2px rgba(44, 57, 63, 0.08),
          0 5px 14px rgba(44, 57, 63, 0.07);
      }

      .variant-index {
        display: grid;
        width: 23px;
        height: 23px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 6px;
        background: rgba(49, 64, 73, 0.07);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .variant-button.active .variant-index {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .variant-label {
        overflow: hidden;
        font-size: 12px;
        font-weight: 630;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recommended-mark {
        margin-left: auto;
        color: var(--accent);
        font-size: 10px;
        font-weight: 650;
      }

      .editor-shell,
      .editor-chrome,
      .tabbar,
      .toolbar,
      .tab,
      .document-viewport {
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          border-radius 180ms ease,
          box-shadow 180ms ease;
      }

      .context-toolbar,
      .insertion-guide {
        display: none;
      }

      /* 方案 1：极浅承载色配合微边界，仍保持传统编辑器结构。 */
      .app-window[data-variant='micro'] .editor-chrome {
        overflow: visible;
        border-bottom: 1px solid rgba(49, 64, 73, 0.1);
        background: var(--canvas);
        box-shadow: none;
      }

      .app-window[data-variant='micro'] .tabbar {
        background: var(--shell);
      }

      .app-window[data-variant='micro'] .tab.active {
        background: #fafbfb;
      }

      .app-window[data-variant='micro'] .toolbar {
        border-top: 1px solid rgba(49, 64, 73, 0.055);
        background: #fafbfb;
        box-shadow: none;
      }

      .app-window[data-variant='micro'] .document-viewport {
        border-radius: 0;
        box-shadow: none;
      }

      /* 方案 2：边界由柔和投影表达，工具栏成为轻量悬浮层。 */
      .app-window[data-variant='elevation'] .editor-chrome {
        overflow: visible;
        border-bottom: 0;
        background: var(--shell);
        box-shadow: none;
      }

      .app-window[data-variant='elevation'] .tabbar {
        background: var(--shell);
      }

      .app-window[data-variant='elevation'] .tab.active {
        background: #fbfcfc;
      }

      .app-window[data-variant='elevation'] .toolbar {
        position: relative;
        z-index: 3;
        background: #fbfcfc;
        box-shadow:
          0 1px 0 rgba(49, 64, 73, 0.07),
          0 9px 20px rgba(55, 72, 79, 0.13);
      }

      .app-window[data-variant='elevation'] .document-viewport {
        border-radius: 0;
        box-shadow: none;
      }

      /* 方案 3：灰色承载菜单和标签区；激活 Tab、工具栏与正文组成一张连续白卡。 */
      .app-window[data-variant='unified'] .editor-shell {
        background: var(--shell);
        box-shadow: none;
      }

      .app-window[data-variant='unified'] .editor-chrome {
        overflow: visible;
        border-bottom: 0;
        background: var(--shell);
        box-shadow: none;
      }

      .app-window[data-variant='unified'] .tabbar {
        background: var(--shell);
      }

      .app-window[data-variant='unified'] .tab.active {
        z-index: 4;
        isolation: isolate;
        border-radius: 10px 10px 0 0;
        background: var(--canvas);
        box-shadow: 0 1px 0 var(--canvas);
      }

      .app-window[data-variant='unified'] .tab.active::before,
      .app-window[data-variant='unified'] .tab.active::after {
        position: absolute;
        bottom: 0;
        display: block;
        width: 10px;
        height: 10px;
        background: transparent;
        content: '';
        pointer-events: none;
      }

      .app-window[data-variant='unified'] .tab.active::before {
        right: auto;
        left: -10px;
        border-radius: 0 0 10px 0;
        box-shadow: 5px 5px 0 5px var(--canvas);
      }

      .app-window[data-variant='unified'] .tab.active::after {
        right: -10px;
        left: auto;
        border-radius: 0 0 0 10px;
        box-shadow: -5px 5px 0 5px var(--canvas);
      }

      .app-window[data-variant='unified'] .toolbar {
        position: relative;
        z-index: 3;
        border-bottom: 1px solid rgba(49, 64, 73, 0.085);
        border-top-left-radius: 0;
        background: var(--canvas);
        box-shadow:
          -1px -1px 0 rgba(66, 82, 89, 0.13),
          -7px -4px 18px rgba(57, 75, 82, 0.09);
      }

      .app-window[data-variant='unified'] .document-viewport {
        z-index: 1;
        border-radius: 0;
        background: var(--canvas);
        box-shadow: none;
      }

      /* 方案 4：常驻栏只保留高频命令，其余格式能力按上下文浮现。 */
      .app-window[data-variant='floating'] .editor-chrome {
        border-bottom: 1px solid rgba(49, 64, 73, 0.09);
        background: var(--shell);
      }

      .app-window[data-variant='floating'] .tabbar {
        background: var(--shell);
      }

      .app-window[data-variant='floating'] .tab.active {
        background: #fafbfb;
      }

      .app-window[data-variant='floating'] .toolbar {
        height: 44px;
        background: #fafbfb;
      }

      .app-window[data-variant='floating']
        .toolbar
        > .tool-button:nth-of-type(n + 6):nth-of-type(-n + 16),
      .app-window[data-variant='floating'] .toolbar > .tool-divider {
        display: none;
      }

      .app-window[data-variant='floating'] .context-toolbar {
        position: absolute;
        z-index: 4;
        top: 166px;
        left: clamp(92px, 18%, 260px);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: #303533;
        color: #eef3f1;
        box-shadow:
          0 12px 30px rgba(25, 35, 34, 0.2),
          0 3px 9px rgba(25, 35, 34, 0.15);
      }

      .app-window[data-variant='floating'] .context-toolbar::after {
        position: absolute;
        bottom: -5px;
        left: 17px;
        width: 10px;
        height: 10px;
        background: #303533;
        content: '';
        transform: rotate(45deg);
      }

      .context-button {
        position: relative;
        z-index: 1;
        display: grid;
        width: 29px;
        height: 27px;
        place-items: center;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #dce4e1;
        cursor: pointer;
        font-size: 13px;
      }

      .context-button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .context-button.emphasis {
        font-weight: 720;
      }

      .context-button.slant {
        font-family: Georgia, serif;
        font-style: italic;
      }

      .context-separator {
        width: 1px;
        height: 17px;
        margin: 0 2px;
        background: rgba(255, 255, 255, 0.14);
      }

      .app-window[data-variant='floating'] .insertion-guide {
        position: absolute;
        z-index: 3;
        top: 217px;
        left: clamp(70px, calc(18% - 22px), 238px);
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .insert-button {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 1px solid rgba(46, 130, 117, 0.3);
        border-radius: 6px;
        background: #fff;
        color: var(--accent);
        font-size: 17px;
        line-height: 1;
      }

      .fake-caret {
        width: 1.5px;
        height: 25px;
        border-radius: 2px;
        background: var(--accent);
      }

      .svg-symbols {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

        },
        unified: {
          title: '方案 3 · 卡片式模块化（整合顶层）',
          description: '系统菜单与标签区保持浅灰，激活 Tab、工具栏和正文连接成一张完整白卡。',
          explanation:
            '灰色只承担软件框架；当前激活的标签页以白色向下连接工具栏和编辑器，三者之间没有色块断层，仅在工具栏与正文之间保留一条微边界。',
          note: '背景层与白色内容卡两层结构',
        },
        floating: {
          title: '方案 4 · Markdown 浮动',
          description: '常驻栏只保留高频能力，其余格式命令随选区浮现，正文最纯净。',
          explanation:
            '顶部只保留基础格式、搜索和视图控制；复杂格式能力在选区或光标附近出现，更适合强调沉浸写作的 Markdown 模式。',
          note: '低频命令按上下文浮现',
        },
      };

      const appWindow = document.querySelector('.app-window');
      const conceptTitle = document.querySelector('#concept-title');
      const conceptDescription = document.querySelector('#concept-description');
      const documentExplanation = document.querySelector('#document-explanation');
      const designNote = document.querySelector('#design-note');
      const variantButtons = [...document.querySelectorAll('[data-target-variant]')];

      function selectVariant(variant) {
        const concept = concepts[variant];
        if (!concept) return;

        appWindow.dataset.variant = variant;
        conceptTitle.textContent = concept.title;
        conceptDescription.textContent = concept.description;
        documentExplanation.textContent = concept.explanation;
        designNote.textContent = concept.note;

        variantButtons.forEach((button) => {
          const selected = button.dataset.targetVariant === variant;
          button.classList.toggle('active', selected);
          button.setAttribute('aria-pressed', String(selected));
        });

        try {
          history.replaceState(null, '', `#${variant}`);
        } catch {
          // 本地文件协议不允许改写历史时，方案切换本身仍然可用。
        }
      }

      variantButtons.forEach((button) => {
        button.addEventListener('click', () => selectVariant(button.dataset.targetVariant));
      });

      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        const variantByKey = ['micro', 'elevation', 'unified', 'floating'][Number(event.key) - 1];
        if (variantByKey) selectVariant(variantByKey);
      });

      const requestedVariant = location.hash.slice(1);
      selectVariant(concepts[requestedVariant] ? requestedVariant : 'micro');
    </script>
  </body>
</html>
