<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nomo 文件管理器选中态方案</title>
    <style>
      :root {
        color-scheme: light;
        --page: #ececea;
        --page-grid: rgba(28, 30, 29, 0.045);
        --ink: #242625;
        --muted: #737774;
        --hairline: rgba(33, 37, 35, 0.11);
        --card: rgba(248, 248, 246, 0.88);
        --rail: #e9e9e6;
        --surface: #f9f9f7;
        --surface-raised: #ffffff;
        --accent: #187f78;
        --accent-strong: #0d6963;
        --accent-soft: rgba(24, 127, 120, 0.1);
        --shadow: 0 18px 50px rgba(27, 31, 29, 0.08);
        --ease: cubic-bezier(0.22, 0.8, 0.28, 1);
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --page: #171918;
        --page-grid: rgba(255, 255, 255, 0.035);
        --ink: #e9ebe8;
        --muted: #969c98;
        --hairline: rgba(238, 243, 239, 0.1);
        --card: rgba(31, 34, 32, 0.9);
        --rail: #202321;
        --surface: #292d2a;
        --surface-raised: #303531;
        --accent: #67bdb5;
        --accent-strong: #8bd2cc;
        --accent-soft: rgba(103, 189, 181, 0.11);
        --shadow: 0 22px 58px rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          linear-gradient(var(--page-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--page-grid) 1px, transparent 1px), var(--page);
        background-size: 28px 28px;
        color: var(--ink);
        font-family: 'Segoe UI Variable Text', 'Aptos', 'Microsoft YaHei UI', sans-serif;
        transition:
          background-color 180ms ease,
          color 180ms ease;
      }

      button {
        font: inherit;
      }

      .page {
        width: min(1480px, calc(100% - 40px));
        margin: 0 auto;
        padding: 44px 0 64px;
      }

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 680;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 18px;
        height: 2px;
        border-radius: 99px;
        background: var(--accent);
        content: '';
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 52px);
        font-weight: 630;
        letter-spacing: -0.045em;
        line-height: 1.03;
      }

      .intro {
        max-width: 650px;
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      }

      .theme-toggle:hover {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--hairline));
      }

      .scheme-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }

      .scheme {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--hairline);
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .scheme-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 17px 18px 15px;
        border-bottom: 1px solid var(--hairline);
      }

      .scheme-letter {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--hairline);
        border-radius: 9px;
        background: var(--surface);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 750;
      }

      .scheme-title {
        margin: 0;
        font-size: 15px;
        font-weight: 660;
        letter-spacing: -0.015em;
      }

      .scheme-note {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .badge {
        padding: 5px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 10px;
        font-weight: 720;
        letter-spacing: 0.04em;
      }

      .mock-app {
        height: 360px;
        background: var(--surface);
      }

      .window-bar {
        display: flex;
        align-items: center;
        height: 38px;
        padding: 0 12px;
        border-bottom: 1px solid var(--hairline);
        background: color-mix(in srgb, var(--rail) 86%, var(--surface));
      }

      .dots {
        display: flex;
        gap: 5px;
      }

      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--muted) 48%, transparent);
      }

      .window-title {
        margin-left: auto;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .workspace {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        height: calc(100% - 38px);
      }

      .sidebar {
        min-width: 0;
        padding: 15px 10px 12px;
        border-right: 1px solid var(--hairline);
        background: var(--rail);
      }

      .sidebar-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 24px;
        padding: 0 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .tiny-actions {
        color: color-mix(in srgb, var(--muted) 70%, transparent);
        letter-spacing: 0.16em;
      }

      .project-row,
      .folder-row {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 30px;
        padding: 0 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 610;
      }

      .folder-row {
        margin-top: 3px;
        padding-left: 17px;
        color: var(--muted);
        font-weight: 560;
      }

      .chevron {
        width: 8px;
        color: var(--muted);
        font-size: 9px;
      }

      .folder-icon,
      .file-icon {
        position: relative;
        flex: 0 0 auto;
      }

      .folder-icon {
        width: 13px;
        height: 9px;
        border: 1px solid currentColor;
        border-radius: 2px;
        color: color-mix(in srgb, var(--muted) 76%, transparent);
      }

      .folder-icon::before {
        position: absolute;
        top: -4px;
        left: 1px;
        width: 6px;
        height: 4px;
        border: 1px solid currentColor;
        border-bottom: 0;
        border-radius: 2px 2px 0 0;
        content: '';
      }

      .file-list {
        position: relative;
        margin-top: 1px;
      }

      .file-row {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 15px minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        width: 100%;
        height: 34px;
        padding: 0 9px 0 34px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
        transition: color 140ms ease;
      }

      .file-row:hover {
        color: var(--ink);
      }

      .file-row.is-selected {
        color: var(--ink);
        font-weight: 620;
      }

      .file-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .file-icon {
        width: 11px;
        height: 14px;
        border: 1px solid currentColor;
        border-radius: 2px;
        color: color-mix(in srgb, var(--muted) 80%, transparent);
      }

      .file-icon::after {
        position: absolute;
        top: 3px;
        right: 2px;
        left: 2px;
        height: 1px;
        background: currentColor;
        box-shadow:
          0 3px 0 currentColor,
          0 6px 0 currentColor;
        opacity: 0.55;
        content: '';
      }

      .is-selected .file-icon {
        color: var(--accent);
      }

      .file-meta {
        color: var(--muted);
        font-size: 9px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 140ms ease;
      }

      .file-row:hover .file-meta,
      .file-row.is-selected .file-meta {
        opacity: 0.72;
      }

      .selection {
        position: absolute;
        top: 1px;
        right: 3px;
        left: 3px;
        z-index: 1;
        height: 32px;
        pointer-events: none;
        transform: translateY(0);
        transition: transform 210ms var(--ease);
        will-change: transform;
      }

      .scheme-a .selection {
        border: 1px solid color-mix(in srgb, var(--accent) 14%, var(--hairline));
        border-radius: 9px;
        background: color-mix(in srgb, var(--surface-raised) 94%, var(--accent) 6%);
        box-shadow: 0 2px 7px rgba(21, 34, 31, 0.07);
      }

      .scheme-a .selection::before {
        position: absolute;
        top: 9px;
        bottom: 9px;
        left: 5px;
        width: 2px;
        border-radius: 9px;
        background: var(--accent);
        content: '';
      }

      .scheme-b .selection {
        border-radius: 8px;
        background: var(--accent-soft);
      }

      .scheme-b .file-row.is-selected {
        color: var(--accent-strong);
      }

      .scheme-c .selection {
        border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--hairline));
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface) 97%, var(--accent) 3%);
      }

      .scheme-c .selection::after {
        position: absolute;
        top: 50%;
        right: 9px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
        content: '';
        transform: translateY(-50%);
      }

      .scheme-d .selection {
        right: auto;
        left: 8px;
        width: 2px;
        border-radius: 99px;
        background: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
      }

      .scheme-d .file-row.is-selected {
        color: var(--accent-strong);
      }

      .editor {
        min-width: 0;
        background: var(--surface);
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        height: 40px;
        padding-left: 10px;
        border-bottom: 1px solid var(--hairline);
        background: var(--rail);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 150px;
        height: 34px;
        padding: 0 12px;
        border-radius: 9px 9px 0 0;
        background: var(--surface);
        color: var(--ink);
        font-size: 11px;
        font-weight: 620;
      }

      .tab-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }

      .document {
        padding: 31px 34px;
      }

      .doc-kicker {
        width: 48px;
        height: 5px;
        margin-bottom: 12px;
        border-radius: 99px;
        background: var(--accent);
        opacity: 0.75;
      }

      .doc-title {
        width: min(70%, 260px);
        height: 18px;
        margin-bottom: 22px;
        border-radius: 5px;
        background: color-mix(in srgb, var(--ink) 82%, transparent);
      }

      .doc-line {
        height: 7px;
        margin: 10px 0;
        border-radius: 99px;
        background: color-mix(in srgb, var(--muted) 20%, transparent);
      }

      .doc-line:nth-child(3) {
        width: 88%;
      }
      .doc-line:nth-child(4) {
        width: 74%;
      }
      .doc-line:nth-child(5) {
        width: 82%;
      }
      .doc-line:nth-child(6) {
        width: 56%;
      }

      .hint {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 28px;
        color: var(--muted);
        font-size: 12px;
      }

      .hint kbd {
        padding: 4px 7px;
        border: 1px solid var(--hairline);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-weight: 650;
      }

      @media (max-width: 980px) {
        .scheme-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        .page {
          width: min(100% - 22px, 1480px);
          padding-top: 28px;
        }

        .page-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .workspace {
          grid-template-columns: minmax(190px, 58%) minmax(0, 1fr);
        }

        .document {
          padding: 24px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <div class="eyebrow">Nomo Explorer</div>
          <h1>选中态，做减法。</h1>
          <p class="intro">
            四个方案都只移动一个独立底板，文件行本身保持透明。点击任意文件观察切换效果，重点比较填充、描边和强调线的存在感。
          </p>
        </div>
        <button class="theme-toggle" type="button" aria-label="切换明暗主题">
          <span class="theme-symbol">◐</span>
          <span class="theme-label">深色预览</span>
        </button>
      </header>

      <section class="scheme-grid" aria-label="文件管理器选中态方案">
        <article class="scheme scheme-a">
          <header class="scheme-head">
            <span class="scheme-letter">A</span>
            <div>
              <h2 class="scheme-title">柔和表面</h2>
              <p class="scheme-note">轻表面、短强调条、微弱层次</p>
            </div>
            <span class="badge">推荐</span>
          </header>
          <div class="mock-app"></div>
        </article>

        <article class="scheme scheme-b">
          <header class="scheme-head">
            <span class="scheme-letter">B</span>
            <div>
              <h2 class="scheme-title">轻雾强调</h2>
              <p class="scheme-note">无描边、无阴影、强调色淡填充</p>
            </div>
          </header>
          <div class="mock-app"></div>
        </article>

        <article class="scheme scheme-c">
          <header class="scheme-head">
            <span class="scheme-letter">C</span>
            <div>
              <h2 class="scheme-title">精细描边</h2>
              <p class="scheme-note">近乎透明，以 hairline 建立秩序</p>
            </div>
          </header>
          <div class="mock-app"></div>
        </article>

        <article class="scheme scheme-d">
          <header class="scheme-head">
            <span class="scheme-letter">D</span>
            <div>
              <h2 class="scheme-title">极简导轨</h2>
              <p class="scheme-note">无背景块，只移动一条细线</p>
            </div>
          </header>
          <div class="mock-app"></div>
        </article>
      </section>

      <p class="hint"><kbd>提示</kbd> 每个方案可以独立点击文件；右上角可检查深色主题表现。</p>
    </main>

    <template id="app-template">
      <div class="window-bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="window-title">Nomo</span>
      </div>
      <div class="workspace">
        <aside class="sidebar">
          <div class="sidebar-label">
            <span>Explorer</span><span class="tiny-actions">＋ ···</span>
          </div>
          <div class="project-row">
            <span class="chevron">⌄</span><span class="folder-icon"></span><span>nomo-notes</span>
          </div>
          <div class="folder-row">
            <span class="chevron">⌄</span><span class="folder-icon"></span><span>docs</span>
          </div>
          <div class="file-list">
            <span class="selection" aria-hidden="true"></span>
            <button class="file-row is-selected" type="button" data-name="overview.md">
              <span class="file-icon"></span><span>overview.md</span
              ><span class="file-meta">MD</span>
            </button>
            <button class="file-row" type="button" data-name="principles.md">
              <span class="file-icon"></span><span>principles.md</span
              ><span class="file-meta">MD</span>
            </button>
            <button class="file-row" type="button" data-name="roadmap.md">
              <span class="file-icon"></span><span>roadmap.md</span
              ><span class="file-meta">MD</span>
            </button>
            <button class="file-row" type="button" data-name="release-notes.md">
              <span class="file-icon"></span><span>release-notes.md</span
              ><span class="file-meta">MD</span>
            </button>
            <button class="file-row" type="button" data-name="scratch.md">
              <span class="file-icon"></span><span>scratch.md</span
              ><span class="file-meta">MD</span>
            </button>
          </div>
        </aside>
        <section class="editor">
          <div class="tabs">
            <div class="tab"><i class="tab-dot"></i><span>overview.md</span></div>
          </div>
          <div class="document">
            <div class="doc-kicker"></div>
            <div class="doc-title"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
          </div>
        </section>
      </div>
    </template>

    <script>
      const template = document.querySelector('#app-template');

      document.querySelectorAll('.mock-app').forEach((host) => {
        host.append(template.content.cloneNode(true));
        const rows = [...host.querySelectorAll('.file-row')];
        const indicator = host.querySelector('.selection');
        const tabLabel = host.querySelector('.tab span');

        function select(row) {
          rows.forEach((item) => item.classList.toggle('is-selected', item === row));
          indicator.style.transform = `translateY(${row.offsetTop}px)`;
          tabLabel.textContent = row.dataset.name;
        }

        rows.forEach((row) => row.addEventListener('click', () => select(row)));
        requestAnimationFrame(() => select(rows[0]));
      });

      const root = document.documentElement;
      const themeButton = document.querySelector('.theme-toggle');
      const themeLabel = document.querySelector('.theme-label');

      themeButton.addEventListener('click', () => {
        const dark = root.dataset.theme !== 'dark';
        root.dataset.theme = dark ? 'dark' : 'light';
        themeLabel.textContent = dark ? '浅色预览' : '深色预览';
      });
    </script>
  </body>
</html>
